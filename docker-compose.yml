services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: videogamecatalogue-sqlserver-express
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - MSSQL_SA_PASSWORD=YourStrong@Password123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql/data

volumes:
  sqlserver-data:
