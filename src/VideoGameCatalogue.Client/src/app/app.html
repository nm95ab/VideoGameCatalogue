<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

      <span class="fs-4">🎮</span>
      <span>Video Game Catalogue</span>
    </a>
    <button
      class="navbar-toggler"
      type="button"
      (click)="isNavbarCollapsed = !isNavbarCollapsed"

      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent" [ngbCollapse]="isNavbarCollapsed">
      <div class="navbar-nav ms-auto d-flex gap-2">
        <a
          class="nav-link"
          routerLink="/games"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="isNavbarCollapsed = true"

        </a>
        <a
          class="nav-link"
          routerLink="/games/new"
          routerLinkActive="active"
          (click)="isNavbarCollapsed = true"
        >

        </a>
      </div>
    </div>
  </div>
